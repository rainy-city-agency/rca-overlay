  <script>
  document.addEventListener('click', function (e) {
    var head = e.target.closest('.faq-q, .split-acc-head');
    if (!head) return;
    var item = head.closest('.faq-item') || head.closest('.split-acc-item');
    if (!item) return;
    var cls = item.classList.contains('faq-item') ? 'faq-item' : 'split-acc-item';
    var open = item.classList.contains('is-open');
    item.parentElement.querySelectorAll('.' + cls).forEach(function (i) {
      i.classList.remove('is-open');
    });
    if (!open) item.classList.add('is-open');
  });
</script>

  <style>
  .nav-mega {
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px);
    pointer-events: none;
    transition:
      opacity 0.25s ease,
      transform 0.25s ease,
      visibility 0.25s;
  }
  .nav-fixed.mega-open .nav-mega {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
    pointer-events: auto;
  }
  .nav-fixed.mega-open .nav-services {
    color: #d97706;

</style>
  <script>
  document.querySelectorAll('.nav-fixed').forEach(function (header) {
    var services = header.querySelector('.nav-services');
    var mega = header.querySelector('.nav-mega');
    if (!services || !mega) return;
    var t;
    function open() {
      clearTimeout(t);
      header.classList.add('mega-open');
    }
    function close() {
      t = setTimeout(function () {
        header.classList.remove('mega-open');
      }, 150);
    }
    [services, mega].forEach(function (el) {
      el.addEventListener('mouseenter', open);
      el.addEventListener('mouseleave', close);
    });
  });
</script>
  <script>
  (function () {
    var root = document.querySelector('.splt-section');
    if (!root) return;
    var tabs = root.querySelectorAll('.splt-tab');
    var panes = root.querySelectorAll('.splt-pane');
    var select = root.querySelector('.splt-select');
    function show(i) {
      tabs.forEach(function (t, j) {
        t.classList.toggle('is-active', j === i);
      });
      panes.forEach(function (p, j) {
        p.classList.toggle('splt-pane-hidden', j !== i);
      });
      if (select) select.selectedIndex = i;
    }
    tabs.forEach(function (t, i) {
      t.addEventListener('click', function () {
        show(i);
      });
    });
    if (select)
      select.addEventListener('change', function () {
        show(select.selectedIndex);
      });
  })();
</script>
